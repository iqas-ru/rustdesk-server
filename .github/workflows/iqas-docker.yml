name: iqas-docker

# Builds linux/amd64 glibc binaries natively and pushes docker-iqas/Dockerfile (debian-slim) to GHCR.

on:
  push:
    branches:
      - iqas-access
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Test access module
        run: cargo test --lib access

      - name: Build
        run: cargo build --release

      - name: Prepare docker context
        run: |
          for b in hbbs hbbr rustdesk-utils; do
            cp target/release/$b docker-iqas/
          done
          chmod -v a+x docker-iqas/hbbs docker-iqas/hbbr docker-iqas/rustdesk-utils

      - name: Publish binaries
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-iqas-linux-amd64
          path: |
            docker-iqas/hbbs
            docker-iqas/hbbr
            docker-iqas/rustdesk-utils
          if-no-files-found: error

      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rustdesk-server-iqas" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-iqas
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
